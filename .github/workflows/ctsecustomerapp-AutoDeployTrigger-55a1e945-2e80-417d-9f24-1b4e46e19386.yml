name: Trigger auto deployment for ctsecustomerapp

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/ctsecustomerapp-AutoDeployTrigger-55a1e945-2e80-417d-9f24-1b4e46e19386.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CTSECUSTOMERAPP_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.CTSECUSTOMERAPP_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CTSECUSTOMERAPP_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: ctseauthcontainer.azurecr.io
          registryUsername: ${{ secrets.CTSECUSTOMERAPP_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.CTSECUSTOMERAPP_REGISTRY_PASSWORD }}
          containerAppName: ctsecustomerapp
          resourceGroup: CTSE_GROUP
          imageToBuild: ctseauthcontainer.azurecr.io/ctsecustomerapp:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


